name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Convert the minimal fixture
        run: |
          go run ./cmd/converter \
            -dataset-path internal/converter/testdata/minimal
          diff -u \
            internal/converter/testdata/minimal/expected.rdf \
            internal/converter/testdata/minimal/output.rdf
