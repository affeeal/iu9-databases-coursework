---
files:
  - name: mooc_action_labels.tsv
    delimiter: "\t"
    declarations:
      - name: ACTIONID
        type: id
        prefix: a
      - name: LABEL
        type: int
    rdfs:
      - subject: ACTIONID
        predicate: label
        object: LABEL
  - name: mooc_action_features.tsv
    delimiter: "\t"
    declarations:
      - name: ACTIONID
        type: id
        prefix: a
      - name: FEATURE0
        type: float
      - name: FEATURE1
        type: float
      - name: FEATURE2
        type: float
      - name: FEATURE3
        type: float
    rdfs:
      - subject: ACTIONID
        predicate: feature0
        object: FEATURE0
      - subject: ACTIONID
        predicate: feature1
        object: FEATURE1
      - subject: ACTIONID
        predicate: feature2
        object: FEATURE2
      - subject: ACTIONID
        predicate: feature3
        object: FEATURE3
  - name: mooc_actions.tsv
    delimiter: "\t"
    declarations:
      - name: ACTIONID
        type: id
        prefix: a
      - name: USERID
        type: id
        prefix: u
      - name: TARGETID
        type: id
        prefix: t
      - name: TIMESTAMP
        type: float
    rdfs:
      - subject: ACTIONID
        predicate: actionId
        object: ACTIONID
        cast_object_to: int
      - subject: USERID
        predicate: userId
        object: USERID
        cast_object_to: int
      - subject: TARGETID
        predicate: targetId
        object: TARGETID
        cast_object_to: int
      - subject: ACTIONID
        predicate: timestamp
        object: TIMESTAMP
      - subject: USERID
        predicate: performs
        object: ACTIONID
      - subject: ACTIONID
        predicate: on
        object: TARGETID
