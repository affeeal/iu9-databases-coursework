---
files:
  - name: token_transfers.csv
    declarations:
      - name: from_address
        type: id
        prefix: a
      - name: to_address
        type: id
        prefix: a
      - name: contract_address
        type: id
        prefix: a
      - name: block_number
        type: int
      - name: transaction_index
        type: int
      - name: time_stamp
        type: int
      - name: value
        type: float
    artificial_declaration:
      name: transfer
      type: id
      prefix: t
    rdfs:
      - subject: from_address
        predicate: address
        object: from_address
        cast_object_to: string
      - subject: to_address
        predicate: address
        object: to_address
        cast_object_to: string
      - subject: contract_address
        predicate: address
        object: contract_address
        cast_object_to: string
      - subject: from_address
        predicate: from
        object: transfer
      - subject: transfer
        predicate: contract
        object: contract_address
      - subject: transfer
        predicate: to
        object: to_address
      - subject: transfer
        predicate: block_number
        object: block_number
      - subject: transfer
        predicate: transaction_index
        object: transaction_index
      - subject: transfer
        predicate: time_stamp
        object: time_stamp
      - subject: transfer
        predicate: value
        object: value
