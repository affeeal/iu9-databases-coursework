---
files:
  - name: roadNet-CA.txt
    headers: [FromNodeId, ToNodeId]
    delimiter: "\t"
    comment: "#"
    declarations:
      - name: FromNodeId
        type: id
      - name: ToNodeId
        type: id
    rdfs:
      - subject: FromNodeId
        predicate: successors
        object: ToNodeId
      - subject: FromNodeId
        predicate: id
        object: FromNodeId
        cast_object_to: int
      - subject: ToNodeId
        predicate: id
        object: ToNodeId
        cast_object_to: int
